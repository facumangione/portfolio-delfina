# Blueprint de Render: crea el servicio web con su disco y variables.
# En Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: portfolio-delfina
    runtime: node
    plan: starter # el disco persistente requiere un plan pago
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    disk:
      name: datos
      mountPath: /data # base de datos SQLite y fotos (originales y optimizadas)
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: STORAGE_DIR
        value: /data/storage
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
